name: Windows CMake CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: MinGW Debug
    runs-on: windows-2025
    timeout-minutes: 35

    env:
      VCPKG_DEFAULT_TRIPLET: x64-mingw-dynamic

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt and MinGW
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.10.1"
          host: windows
          target: desktop
          arch: win64_mingw
          tools: "tools_mingw1310,qt.tools.win64_mingw1310"
          cache: true
          set-env: true
          add-tools-to-path: true

      - name: Prepare vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgJsonGlob: "**/vcpkg.json"
          doNotCache: false

      - name: Export preset inputs
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          if (-not $env:QT_ROOT_DIR) {
            throw "QT_ROOT_DIR was not set by Qt installation."
          }
          if (-not $env:IQTA_TOOLS) {
            throw "IQTA_TOOLS was not set by Qt installation."
          }
          if (-not $env:VCPKG_ROOT) {
            throw "VCPKG_ROOT was not set by vcpkg setup."
          }

          $mingwRoots = @(
            Get-ChildItem -LiteralPath $env:IQTA_TOOLS -Directory |
              Where-Object {
                Test-Path -LiteralPath (Join-Path $_.FullName "bin\c++.exe")
              }
          )

          if ($mingwRoots.Count -ne 1) {
            throw "Expected exactly one MinGW root containing bin\c++.exe."
          }

          "CHATHUB_MINGW_ROOT=$($mingwRoots[0].FullName)" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Configure
        run: cmake --preset ci-windows-mingw-debug

      - name: Build
        run: cmake --build --preset ci-windows-mingw-debug-build

      - name: Test without external services
        run: ctest --preset ci-windows-mingw-debug-test -LE "mysql|redis"

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cmake-test-diagnostics
          if-no-files-found: ignore
          path: |
            out/build/ci-windows-mingw-debug/Testing/Temporary/LastTest.log
            out/build/ci-windows-mingw-debug/CMakeFiles/CMakeError.log
